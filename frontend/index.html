<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    
</head>
<body>
    <h1>Task Manager</h1>
    
    <div class="stats">
        <span>Total: <strong id="totalTasks">0</strong></span> | 
        <span>Completed: <strong id="completedTasks">0</strong></span> | 
        <span>Pending: <strong id="pendingTasks">0</strong></span>
    </div>

    <div class="task-form">
        <input type="text" id="taskInput" class="task-input" placeholder="Enter a new task...">
        <button type="submit">Add</button>
    </div>
	<div id="message"></div>
    <script>
        let tasks = [];
        let editingTaskId = null;     

        function saveTask(id) {
            const input = document.getElementById(`edit-input-${id}`);
            const newText = input.value.trim();

            if (newText === '') {
                alert('Task cannot be empty!');
                return;
            }

            const task = tasks.find(t => t.id === id);
            if (task) {
                task.text = newText;
                saveTasks();
            }

            editingTaskId = null;
            renderTasks();
        }

        function load() {
          const tasks = [
            { id: 1, title: "Tarea de ejemplo", completed: false },
            { id: 2, title: "Otra tarea", completed: true }
          ];
          const list = document.getElementById("list");
          list.innerHTML = "";
          tasks.forEach(t => {
            const li = document.createElement("li");
            li.textContent = t.title + (t.completed ? "-" : "");
            list.appendChild(li);
          });
        }
        load();
		document.getElementById('taskForm').addEventListener('submit', async function(e) {
			e.preventDefault();
			const task = document.getElementById('taskInput').value;
			const response = await fetch('http://localhost:4000/tasks', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({ description: task })
			});
			const messageDiv = document.getElementById('message');
			if (response.ok) {
				messageDiv.textContent = 'Task added successfully';
				document.getElementById('taskForm').reset();
			} else {
				messageDiv.textContent = 'Error adding task';
			}
		});

    </script>
</html>
