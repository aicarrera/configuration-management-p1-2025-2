<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Task Tracker</title>
  <style>
    body {
      background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      min-width: 350px;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #f76d6d;
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: 1px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #f6f6f6;
      margin-bottom: 0.8rem;
      padding: 0.9rem 1.2rem;
      border-radius: 8px;
      font-size: 1.1rem;
      color: #333;
      display: flex;
      align-items: center;
      transition: background 0.2s;
    }
    li.completed {
      text-decoration: line-through;
      color: #aaa;
      background: #e0e0e0;
    }
    li::before {
      content: "📝";
      margin-right: 0.7rem;
      font-size: 1.2rem;
    }
    li.completed::before {
      content: "✔️";
      color: #4caf50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lista de Tareas</h1>
    <ul id="task-list"></ul>
  </div>
  <script>
    async function fetchTasks() {
      const response = await fetch('http://localhost:3000/tasks');
      const tasks = await response.json();
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.textContent = task.title;
        if (task.completed) {
          li.classList.add('completed');
        }
        list.appendChild(li);
      });
    }
    fetchTasks();
  </script>
</body>
</html>
