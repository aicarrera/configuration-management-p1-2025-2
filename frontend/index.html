<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas Local (Versión Segura)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
    }

    h1 {
      color: #333;
    }

    #localTaskForm {
      margin-bottom: 20px;
    }

    #localTaskInput {
      padding: 10px;
      font-size: 16px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #localTaskForm button {
      padding: 10px 15px;
      font-size: 16px;
      margin-left: 5px;
      border: none;
      background-color: #28a745;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    #localTaskForm button:hover {
      background-color: #218838;
    }

    #localTaskList {
      list-style: none;
      padding: 0;
      width: 300px;
    }

    #localTaskList li {
      background: white;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #localTaskList li.completed {
      text-decoration: line-through;
      color: gray;
    }

    #localTaskList li button {
      background-color: #007bff;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    #localTaskList li button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Lista de Tareas Local</h1>

  <form id="localTaskForm">
    <input type="text" id="localTaskInput" placeholder="Agregar nueva tarea" required>
    <button type="submit">Agregar</button>
  </form>

  <ul id="localTaskList"></ul>

  <script>

    const localForm = document.getElementById('localTaskForm');
    const localInput = document.getElementById('localTaskInput');
    const localList = document.getElementById('localTaskList');

    function createLocalTask(text) {
      const li = document.createElement('li');
      li.textContent = text;

      const completeBtn = document.createElement('button');
      completeBtn.textContent = '✔';
      completeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        li.classList.toggle('completed');
      });

      li.appendChild(completeBtn);
      localList.appendChild(li);
    }

    localForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const taskText = localInput.value.trim();
      if (taskText) {
        createLocalTask(taskText);
        localInput.value = '';
        localInput.focus();
      }
    });
  </script>
</body>
</html>
