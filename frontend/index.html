<!doctype html>
<html lang="es">
<body>
  
  <script>
    const API = 'http://localhost:3000'; // ajusta si corres en otro puerto

    async function fetchTasks() {
      const res = await fetch(${API}/tasks);
      const tasks = await res.json();
      render(tasks);
    }

    function render(tasks) {
      const ul = document.getElementById('task-list');
      ul.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t.title;
        if (t.completed) li.classList.add('done');
        const btn = document.createElement('button');
        btn.textContent = t.completed ? 'Completada' : 'Marcar completa';
        btn.disabled = t.completed;
        btn.onclick = async () => {
          await fetch(${API}/tasks/${t.id}, { method: 'PUT' });
          fetchTasks();
        };
        li.append(' ', btn);
        ul.appendChild(li);
      });
    }

    document.getElementById('new-task-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('new-task-input');
      const title = input.value.trim();
      if (!title) return;
      await fetch(${API}/tasks, {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ title })
      });
      input.value = '';
      fetchTasks();
    };

    document.getElementById('refresh').onclick = fetchTasks;

    fetchTasks();
  </script>
</body>
</html>
