<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Team Task Tracker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <style>
    .app { font-family: system-ui, sans-serif; }
    .container { max-width: 640px; margin: 32px auto; padding: 0 16px; }
    .heading { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
    .status { font-size: 12px; color: #555; margin-bottom: 12px; min-height: 1em; }

    .form { margin-top: 16px; }
    .input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
    .form-actions { margin-top: 8px; }
    .btn { padding: 8px 12px; cursor: pointer; border: 1px solid #ddd; border-radius: 6px; background: #f7f7f7; }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body class="app">
  <main class="container">
    <h1 class="heading">Agregar nueva tarea</h1>
    <div id="status" class="status"></div>

    <form id="new-task-form" class="form" autocomplete="off">
      <label for="title" class="sr-only" style="position:absolute;left:-9999px;">Nueva tarea</label>
      <input id="title" name="title" type="text" class="input" placeholder="Escribe una nueva tarea…" required />
      <div class="form-actions">
        <button type="submit" class="btn">Agregar tarea</button>
      </div>
    </form>
  </main>
<script>
        const API_URL = 'http://localhost:3000/api/tasks';

        let tasks = [];

        const taskList = document.getElementById('taskList');
        const totalCount = document.getElementById('totalCount');
        const pendingCount = document.getElementById('pendingCount');
        const completedCount = document.getElementById('completedCount');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        async function toggleTask(id) {
            try {
                const task = tasks.find(t => t.id === id);
                
                if (!task) {
                    console.error('Tarea no encontrada');
                    return;
                }

                const updatedTask = { 
                    ...task, 
                    completed: !task.completed 
                };

                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updatedTask)
                });

                if (!response.ok) {
                    throw new Error('Error al actualizar la tarea');
                }

                const taskIndex = tasks.findIndex(t => t.id === id);
                tasks[taskIndex] = updatedTask;
                
                updateUIAfterToggle(id, updatedTask.completed);
                
                updateCounters();
                
                showSuccess(updatedTask.completed ? 
                    '¡Tarea completada! 🎉' : 
                    'Tarea marcada como pendiente'
                );
                
            } catch (error) {
                showError('No se pudo actualizar la tarea. Intenta nuevamente.');
                console.error('Error:', error);
                
                renderTasks();
            }
        }

        function updateUIAfterToggle(id, completed) {
            const taskElement = document.querySelector(`.task-item[data-id="${id}"]`);
            
            if (!taskElement) return;

            if (completed) {
                taskElement.classList.add('completed');
            } else {
                taskElement.classList.remove('completed');
            }
            
            const statusBadge = taskElement.querySelector('.task-status');
            if (statusBadge) {
                statusBadge.className = completed ? 
                    'task-status status-completed' : 
                    'task-status status-pending';
                statusBadge.textContent = completed ? 'Completada' : 'Pendiente';
            }
        }

        function updateCounters() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;

            totalCount.textContent = total;
            completedCount.textContent = completed;
            pendingCount.textContent = pending;
        }

        function renderTasks() {
            taskList.innerHTML = tasks.map(task => `
                <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                    <input 
                        type="checkbox" 
                        class="task-checkbox" 
                        ${task.completed ? 'checked' : ''}
                        onchange="toggleTask(${task.id})"
                    >
                    <span class="task-text">${escapeHtml(task.title)}</span>
                    <span class="task-status ${task.completed ? 'status-completed' : 'status-pending'}">
                        ${task.completed ? 'Completada' : 'Pendiente'}
                    </span>
                </li>
            `).join('');

            updateCounters();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 4000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }

        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error('Error al cargar las tareas');
                }
                
                tasks = await response.json();
                renderTasks();
            } catch (error) {
                showError('No se pudo conectar con el servidor. Usando tareas de ejemplo.');
                console.error('Error:', error);
                
                tasks = [
                    { id: 1, title: 'Implementar función toggleTask()', completed: true },
                    { id: 2, title: 'Actualizar UI dinámicamente', completed: true },
                    { id: 3, title: 'Añadir animaciones de transición', completed: false },
                    { id: 4, title: 'Manejar errores de conexión', completed: false },
                    { id: 5, title: 'Actualizar contadores en tiempo real', completed: true }
                ];
                renderTasks();
            }
        }

        fetchTasks();

        window.toggleTask = toggleTask;
    </script>
</body>
</html>
