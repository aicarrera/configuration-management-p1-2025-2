<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Team Task Tracker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- === Estilos por clases (encima) === -->
  <style>
    .app { font-family: system-ui, sans-serif; }
    .container { max-width: 640px; margin: 32px auto; padding: 0 16px; }
    .heading { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
    .status { font-size: 12px; color: #555; margin-bottom: 12px; min-height: 1em; }

    .form { margin-top: 16px; }
    .input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
    .form-actions { margin-top: 8px; }
    .btn { padding: 8px 12px; cursor: pointer; border: 1px solid #ddd; border-radius: 6px; background: #f7f7f7; }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body class="app">
  <main class="container">
    <h1 class="heading">Agregar nueva tarea</h1>
    <div id="status" class="status"></div>

    <form id="new-task-form" class="form" autocomplete="off">
      <label for="title" class="sr-only" style="position:absolute;left:-9999px;">Nueva tarea</label>
      <input id="title" name="title" type="text" class="input" placeholder="Escribe una nueva tarea…" required />
      <div class="form-actions">
        <button type="submit" class="btn">Agregar tarea</button>
      </div>
    </form>
  </main>

  <script>
    // Config: usa ?api=http://host:puerto para cambiar el backend si quieres
    const API_BASE = (location.search.includes('api='))
      ? new URLSearchParams(location.search).get('api')
      : 'http://localhost:3000';

    const $status = document.getElementById('status');
    const $form   = document.getElementById('new-task-form');
    const $title  = document.getElementById('title');

    const setStatus = (msg) => ($status.textContent = msg);

    $form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = $title.value.trim();
      if (!title) return;

      setStatus('Creando tarea…');
      try {
        const res = await fetch(`${API_BASE}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          setStatus(`Error: ${err.error || res.status}`);
          return;
        }
        const created = await res.json();
        // No mostramos lista (eso es A). Sólo confirmamos:
        setStatus(`Creada: #${created.id} “${created.title}”`);
        $title.value = '';
        $title.focus();
      } catch (err) {
        setStatus('No se pudo conectar al API');
      }
    });
  </script>
</body>
</html>
